{% extends 'index.html' %}

{% block body %}
    <h2>Recipe Info</h2>
    <h3>{{recipe.name}}</h3>
    <p> Made by: {{recipe.author.name}}</p>
    <ul>
        {% for ingredient in ingredients %}
            <li>{{ingredient.quantity}} {{ ingredient.name }}</li>
        {% endfor %}
    </ul>
    {% for image in images %}
        <img src="{{ image.image.url }}" alt ="{{ image.description }}"/>
    {% endfor %}
    <a href="/recipe/{{ pk }}/add_image">Add an image</a>
{% endblock %}
